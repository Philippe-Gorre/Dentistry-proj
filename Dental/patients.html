<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patients – Dentistry With a Smile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles/patient-tab.css">
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar__inner">
      <a class="logo" href="index.html">
        <svg viewBox="0 0 48 32" width="40" height="27" aria-hidden="true">
          <path d="M6 8 Q24 34 42 8" fill="none" stroke="#5B2BD9" stroke-width="7" stroke-linecap="round"></path>
        </svg>
        <span class="logo__name">Dentistry With a Smile</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="dashboard.html">Dashboard</a>
        <a href="#">Appointments</a>
        <a class="is-active" href="patients.html" aria-current="page">Patients</a>
        <a href="#">Messages</a>
      </nav>
      <div class="topbar__tools">
        <button class="icon-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.5 5 1.5 5h-13S5 12 5 8zM8.3 16.2a2 2 0 0 0 3.4 0"></path></svg>
        </button>
        <span class="avatar">FD</span>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="page">

    <!-- Heading row -->
    <div class="page-head">
      <div class="page-head__text">
        <h1>Patients</h1>
        <p class="muted">Everyone seen today or waiting on a booking request.</p>
      </div>
      <button class="btn btn--primary btn--add" type="button" id="add-patient-btn">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
        Add patient
      </button>
    </div>

    <!-- Search + filter chips -->
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-box__icon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="#5B5476" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M13 13l4 4"></path></svg>
        <input class="search-box__input" type="search" id="patient-search" placeholder="Search by name or phone" autocomplete="off">
      </div>
      <div class="filter-chips" id="filter-chips">
        <button class="fchip is-active" data-filter="all" type="button">All <span class="fchip__count" id="count-all">8</span></button>
        <button class="fchip" data-filter="today" type="button">Visiting today <span class="fchip__count" id="count-today">5</span></button>
        <button class="fchip" data-filter="reply" type="button">Waiting for a reply <span class="fchip__count" id="count-reply">3</span></button>
        <button class="fchip" data-filter="new" type="button">New patients <span class="fchip__count" id="count-new">2</span></button>
      </div>
    </div>

    <!-- Content area: table + detail panel -->
    <div class="content">

      <!-- Patient list / table -->
      <div class="patient-table-wrap">
        <table class="patient-table" id="patient-table">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Last visit</th>
              <th>Next visit</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="patient-tbody">
            <!-- Filled by patients.js -->
          </tbody>
        </table>
      </div>

      <!-- Detail panel (right side) -->
      <aside class="detail-panel" id="detail-panel" hidden>
        <!-- Filled by patients.js -->
      </aside>

    </div>

  </main>

  <!-- ============ ADD PATIENT MODAL ============ -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">

      <!-- Modal header -->
      <div class="modal__header">
        <h2 id="modal-title">Add patient</h2>
        <button class="modal__close" type="button" id="modal-close-btn" aria-label="Close">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"></path></svg>
        </button>
      </div>

      <!-- Modal body / form -->
      <form class="modal__body" id="add-patient-form" novalidate>

        <!-- Personal info -->
        <h3 class="modal__section-title">Personal information</h3>
        <div class="modal__row">
          <div class="modal__field">
            <label for="ap-fname">First name</label>
            <input class="modal__input" id="ap-fname" type="text" autocomplete="given-name" required>
          </div>
          <div class="modal__field">
            <label for="ap-lname">Last name</label>
            <input class="modal__input" id="ap-lname" type="text" autocomplete="family-name" required>
          </div>
        </div>
        <div class="modal__row">
          <div class="modal__field">
            <label for="ap-phone">Phone number</label>
            <input class="modal__input" id="ap-phone" type="tel" autocomplete="tel" placeholder="+63 912 345 6789" maxlength="11" required>
          </div>
          <div class="modal__field">
            <label for="ap-email">Email</label>
            <input class="modal__input" id="ap-email" type="email" autocomplete="email" placeholder="patient@email.com">
          </div>
        </div>

        <!-- Appointment details -->
        <h3 class="modal__section-title">Appointment details</h3>
        <div class="modal__row">
          <div class="modal__field">
            <label for="ap-service">What is it for?</label>
            <select class="modal__input" id="ap-service">
              <option>Check-up and cleaning</option>
              <option>Toothache or something broken</option>
              <option>Filling or repair</option>
              <option>Whitening</option>
              <option>Braces or aligners</option>
              <option>My child's first visit</option>
            </select>
          </div>
          <div class="modal__field">
            <label for="ap-dentist">Dentist</label>
            <select class="modal__input" id="ap-dentist">
              <option>Dr. Mora</option>
              <option>Dr. Silva</option>
            </select>
          </div>
        </div>

        <div class="modal__field">
          <span class="modal__label">Preferred day</span>
          <div class="modal__chips" id="ap-day-chips">
            <button class="modal__chip" type="button" aria-pressed="false">Mon</button>
            <button class="modal__chip" type="button" aria-pressed="true">Tue</button>
            <button class="modal__chip" type="button" aria-pressed="false">Wed</button>
            <button class="modal__chip" type="button" aria-pressed="false">Thu</button>
            <button class="modal__chip" type="button" aria-pressed="false">Fri</button>
            <button class="modal__chip" type="button" aria-pressed="false">Sat</button>
          </div>
        </div>

        <div class="modal__row">
          <div class="modal__field">
            <label for="ap-time">Preferred time</label>
            <select class="modal__input" id="ap-time">
              <option>9:00 am</option>
              <option>10:00 am</option>
              <option>11:00 am</option>
              <option>12:00 pm</option>
              <option>1:00 pm</option>
              <option>2:00 pm</option>
              <option>3:00 pm</option>
              <option>4:00 pm</option>
            </select>
          </div>
          <div class="modal__field">
            <label for="ap-chair">Chair</label>
            <select class="modal__input" id="ap-chair">
              <option>Chair 1</option>
              <option>Chair 2</option>
            </select>
          </div>
        </div>

        <!-- Note -->
        <div class="modal__field">
          <label for="ap-note">Front desk note</label>
          <textarea class="modal__input modal__textarea" id="ap-note" placeholder="Any notes about the patient…"></textarea>
        </div>

        <!-- Error message -->
        <p class="modal__error" id="ap-error" hidden></p>

        <!-- Actions -->
        <div class="modal__actions">
          <button class="btn btn--primary" type="submit">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
            Add patient
          </button>
          <button class="btn btn--outline" type="button" id="modal-cancel-btn">Cancel</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="Javascript/patients.js" defer></script>
</body>
</html>
