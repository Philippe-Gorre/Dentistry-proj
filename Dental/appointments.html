<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments – Dentistry With a Smile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles/appointments.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="logo" href="index.html">
        <svg viewBox="0 0 48 32" width="40" height="27" aria-hidden="true">
          <path d="M6 8 Q24 34 42 8" fill="none" stroke="#5B2BD9" stroke-width="7" stroke-linecap="round"></path>
        </svg>
        <span class="logo__name">Dentistry With a Smile</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="dashboard.html">Dashboard</a>
        <a class="is-active" href="appointments.html" aria-current="page">Appointments</a>
        <a href="patients.html">Patients</a>
        <a href="#">Messages</a>
      </nav>
      <div class="topbar__tools">
        <button class="icon-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.5 5 1.5 5h-13S5 12 5 8zM8.3 16.2a2 2 0 0 0 3.4 0"></path></svg>
        </button>
        <span class="avatar">FD</span>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Appointments</h1>
        <p class="muted" id="appointment-summary"></p>
      </div>
      <button class="btn btn--primary" type="button" id="new-appointment">
        <span aria-hidden="true">＋</span> New appointment
      </button>
    </div>

    <div class="appointment-layout">
      <aside class="sidebar">
        <section class="panel calendar-panel" aria-label="Calendar">
          <div class="month-head">
            <h2 id="calendar-month"></h2>
            <div class="round-actions">
              <button type="button" class="round-btn" id="prev-month" aria-label="Previous month">‹</button>
              <button type="button" class="round-btn" id="next-month" aria-label="Next month">›</button>
            </div>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div class="mini-calendar" id="mini-calendar"></div>
        </section>

      </aside>

      <section class="schedule-panel" aria-label="Appointment schedule">
        <div class="schedule-toolbar">
          <div class="date-navigation">
            <button type="button" class="round-btn" id="prev-day" aria-label="Previous day">‹</button>
            <h2 id="selected-date"></h2>
            <button type="button" class="round-btn" id="next-day" aria-label="Next day">›</button>
            <button type="button" class="today-btn" id="go-today">Today</button>
          </div>
          <div class="view-toggle" role="group" aria-label="Calendar view">
            <button type="button" class="is-active" id="day-view" aria-pressed="true">Day</button>
            <button type="button" id="week-view" aria-pressed="false">Week</button>
          </div>
        </div>

        <div class="legend" aria-label="Appointment status legend">
          <span><i class="legend-dot status-confirmed"></i>Confirmed</span>
          <span><i class="legend-dot status-checked-in"></i>Checked in</span>
          <span><i class="legend-dot status-emergency"></i>Emergency</span>
          <span><i class="legend-dot status-completed"></i>Completed</span>
          <span><i class="legend-dot status-open"></i>Open</span>
        </div>

        <div class="chair-grid-wrap" id="day-view-panel">
          <div class="chair-grid" id="day-grid"></div>
        </div>
        <div class="week-grid" id="week-view-panel" hidden></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="appointment-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="appointment-modal-title">
      <div class="modal-head">
        <h2 id="appointment-modal-title">New appointment</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Close">×</button>
      </div>
      <form id="appointment-form">
        <div class="field">
          <label for="appointment-patient">Patient name</label>
          <input id="appointment-patient" class="input" required maxlength="120" autocomplete="off" list="appointment-patients" placeholder="Choose or enter a patient">
          <datalist id="appointment-patients"></datalist>
        </div>
        <div class="field">
          <label for="appointment-service">Service / Treatment</label>
          <select id="appointment-service" class="input">
            <option>Check-up and cleaning</option>
            <option>Toothache or repair</option>
            <option>Broken tooth</option>
            <option>Whitening</option>
            <option>Aligner check</option>
            <option>Child's first visit</option>
            <option>Crown fitting</option>
          </select>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="appointment-date">Date</label>
            <input id="appointment-date" class="input" type="date" required>
          </div>
          <div class="field">
            <label for="appointment-time">Time</label>
            <select id="appointment-time" class="input">
              <option>9:00 am</option>
              <option>10:00 am</option>
              <option>11:00 am</option>
              <option>12:00 pm</option>
              <option>1:00 pm</option>
              <option>2:00 pm</option>
              <option>3:00 pm</option>
              <option>4:00 pm</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="appointment-chair">Chair</label>
            <select id="appointment-chair" class="input">
              <option value="1">Chair 1 – Dr. Mora</option>
              <option value="2">Chair 2 – Dr. Silva</option>
            </select>
          </div>
          <div class="field">
            <label for="appointment-status">Status</label>
            <select id="appointment-status" class="input">
              <option value="confirmed">Confirmed</option>
              <option value="checked-in">Checked in</option>
              <option value="emergency">Emergency</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>
        <p class="form-error" id="appointment-error" role="alert" hidden></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn--primary">Save appointment</button>
          <button type="button" class="btn btn--outline" data-close-modal>Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="manage-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="manage-title">
      <div class="modal-head">
        <h2 id="manage-title">Appointment details</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Close">×</button>
      </div>
      <div class="manage-details">
        <strong id="manage-patient"></strong>
        <span class="muted" id="manage-info"></span>
        <span id="manage-service"></span>
      </div>
      <div class="field">
        <label for="manage-status">Status</label>
        <select id="manage-status" class="input">
          <option value="confirmed">Confirmed</option>
          <option value="checked-in">Checked in</option>
          <option value="emergency">Emergency</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn--primary" id="save-status">Save status</button>
        <button type="button" class="btn btn--danger" id="cancel-appointment">Cancel appointment</button>
        <button type="button" class="btn btn--outline" data-close-modal>Close</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="Javascript/storage.js" defer></script>
  <script src="Javascript/appointments.js" defer></script>
</body>
</html>
